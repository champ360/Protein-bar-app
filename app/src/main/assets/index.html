<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="A simple personal tracker for The Whole Truth protein bars.">
  <title>Barbook — The Whole Truth tracker</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f6f2;
      --white: #ffffff;
      --surface: #ffffff;
      --surface-2: #eeece7;
      --surface-3: #f5f2f8;
      --ink: #292631;
      --ink-soft: #5f5966;
      --ink-muted: #77717e;
      --muted: #85818d;
      --line: #eae8e3;
      --plum: #49415f;
      --plum-dark: #292536;
      --lavender: #eeeaf7;
      --lavender-deep: #dcd3ef;
      --lime: #dafa66;
      --peach: #f6e9dd;
      --green: #dcefe4;
      --nav-surface: rgba(255,255,255,.94);
      --shadow: 0 12px 34px rgba(43, 37, 54, .07);
      --radius: 22px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { min-height: 100%; background: var(--paper); }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); transition:background-color .42s ease, color .42s ease;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; letter-spacing: -.01em;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(100%, 620px); min-height: 100vh; margin: 0 auto; padding: 0 19px 108px; }
    .topbar { height: 76px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      width: 39px; height: 39px; border-radius: 14px; background: var(--plum-dark); display: grid; place-items: center;
      box-shadow: 0 5px 12px rgba(41,37,54,.16); position: relative; overflow: hidden;
    }
    .brand-mark:before { content:""; width: 20px; height: 23px; border-radius: 7px; background: var(--lime); transform: rotate(-8deg); }
    .brand-mark:after { content:""; position:absolute; width: 4px; height: 14px; border-radius: 9px; background: var(--plum-dark); box-shadow: 6px 0 0 var(--plum-dark), -6px 0 0 var(--plum-dark); }
    .brand-name { font-size: 15px; font-weight: 850; letter-spacing: .12em; line-height: 1.05; }
    .brand-sub { color: var(--muted); font-size: 9px; font-weight: 750; letter-spacing: .12em; margin-top: 4px; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .icon-button { height: 40px; width: 40px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display:grid; place-items:center; color:var(--plum); transition:background-color .38s ease, border-color .38s ease, color .38s ease, transform .38s cubic-bezier(.2,.7,.2,1); }
    .icon-button:active { transform:translateY(1px); }
    .icon-button svg { width:18px; height:18px; }
    main { animation: appear .48s cubic-bezier(.22,.68,.22,1) both; }
    @keyframes appear { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
    .eyebrow { color: #8d8799; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; }
    .hero {
      position: relative; overflow: hidden; border-radius: 27px; background: var(--plum-dark); color: white;
      min-height: 205px; padding: 24px 23px; box-shadow: 0 15px 30px rgba(44,39,58,.13);
    }
    .hero .eyebrow { color: #c9c2d9; }
    .hero h1 { margin: 13px 0 8px; max-width: 290px; font-size: clamp(28px, 7vw, 35px); line-height: 1.04; font-weight: 820; letter-spacing: -.055em; }
    .hero p { color: #d5d1dd; margin: 0; font-size: 12px; line-height: 1.55; max-width: 250px; }
    .hero-cta { margin-top: 17px; display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--lime); color: #2b2930; border-radius: 999px; padding: 10px 14px; font-size: 11px; font-weight: 850; }
    .hero-cta svg { width: 13px; height: 13px; }
    .hero-art { position:absolute; right: 18px; top: 25px; width: 130px; height: 150px; opacity: .96; }
    .orbit { position:absolute; width: 118px; height:118px; right: -1px; top: 14px; border: 1px solid rgba(255,255,255,.16); border-radius:50%; }
    .orbit:after { content:""; position:absolute; inset:12px; border:1px dashed rgba(255,255,255,.17); border-radius:50%; }
    .bar-shape { position:absolute; width: 87px; height: 35px; border-radius: 12px; background: var(--lime); right: 8px; transform: rotate(-35deg); box-shadow: 0 10px 15px rgba(0,0,0,.17); }
    .bar-shape:after { content:""; position:absolute; left: 12px; right: 12px; top: 9px; height: 17px; border-radius: 7px; border: 1px solid rgba(41,37,54,.28); }
    .bar-shape.one { top: 41px; right: 10px; }
    .bar-shape.two { top: 78px; right: 29px; background: #c7b8e4; transform:rotate(-35deg) scale(.88); }
    .bar-shape.three { top: 111px; right: 5px; background: #f1d9bd; transform:rotate(-35deg) scale(.72); }
    .hero-sticker { position:absolute; right: 1px; bottom: 0; width: 46px; height: 46px; border-radius: 50%; background: #fff; color: var(--plum); display:grid; place-items:center; font-size:9px; line-height:1.1; font-weight:900; text-align:center; transform:rotate(10deg); box-shadow: var(--shadow); }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:10px; margin: 25px 1px 13px; }
    .section-head h2 { margin: 0; font-size: 18px; letter-spacing: -.045em; font-weight: 820; }
    .text-link { border:0; background:transparent; color:var(--plum); font-size:11px; font-weight:850; padding:5px 0; }
    .stats { display:grid; grid-template-columns: repeat(3,1fr); gap:9px; margin-top:14px; }
    .stat { min-height:77px; background:var(--surface); border:1px solid var(--line); border-radius:17px; padding:13px 12px; }
    .stat strong { display:block; font-size:22px; letter-spacing:-.06em; line-height:1.1; font-weight:850; }
    .stat span { display:block; color:var(--muted); font-size:10px; font-weight:700; margin-top:6px; }
    .stat .stat-dot { display:inline-block; vertical-align:2px; width:6px; height:6px; border-radius:50%; background:var(--lime); margin-right:5px; }
    .spotlight { color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:21px; padding:15px; display:flex; gap:13px; align-items:center; box-shadow:0 5px 18px rgba(43,37,54,.035); }
    .mini-art { flex:0 0 64px; height:70px; border-radius:17px; display:grid; place-items:center; position:relative; overflow:hidden; background:var(--lavender); }
    .mini-art:before { content:""; height:39px; width:48px; border-radius:13px; background:var(--art,#c9b8e8); transform:rotate(-22deg); box-shadow:0 6px 10px rgba(54,45,75,.12); }
    .mini-art:after { content:""; position:absolute; width:33px; height:12px; border:1px solid rgba(48,40,65,.25); border-radius:6px; transform:rotate(-22deg); }
    .mini-art.pro { --art:#dafa66; background:#f0f4df; }
    .mini-art.core { --art:#c8b8e8; background:#f0ebf9; }
    .mini-art.millet { --art:#edc99c; background:#f8f0e6; }
    .mini-art.mini { --art:#eab9c8; background:#f8edf0; }
    .spotlight-copy { min-width:0; flex:1; }
    .spotlight-copy .meta { display:flex; align-items:center; gap:7px; margin-bottom:5px; }
    .tag { display:inline-flex; align-items:center; padding:4px 7px; border-radius:999px; color:#5d526e; background:var(--lavender); font-size:9px; line-height:1; letter-spacing:.08em; font-weight:850; }
    .tag.tried { background:#e1f1e7; color:#47785e; letter-spacing:0; }
    .tag.tried.rating-good, .read-only-log span.rating-good { background:#dff2e5; color:#286742; }
    .tag.tried.rating-mid, .read-only-log span.rating-mid { background:#fff0c9; color:#7d5b10; }
    .tag.tried.rating-low, .read-only-log span.rating-low { background:#f9e0df; color:#963b38; }
    .rating-buttons button.active.rating-good { background:#dff2e5; border-color:#a9d8b8; color:#286742; }
    .rating-buttons button.active.rating-mid { background:#fff0c9; border-color:#e8d18b; color:#7d5b10; }
    .rating-buttons button.active.rating-low { background:#f9e0df; border-color:#e6b5b2; color:#963b38; }
    .spotlight h3 { margin:0; font-size:15px; font-weight:820; letter-spacing:-.035em; }
    .spotlight p { margin:5px 0 0; font-size:10px; color:var(--muted); }
    .spotlight-side { text-align:right; flex:0 0 auto; }
    .spotlight-side b { display:block; font-size:16px; letter-spacing:-.04em; }
    .spotlight-side small { display:block; margin-top:4px; color:var(--muted); font-size:9px; }
    .page-title { padding: 9px 1px 16px; }
    .page-title h1 { margin:7px 0 5px; font-size:29px; line-height:1.06; font-weight:850; letter-spacing:-.06em; }
    .page-title p { color:var(--muted); margin:0; font-size:12px; }
    .search-wrap { position:relative; margin: 6px 0 13px; }
    .search-wrap svg { position:absolute; width:17px; height:17px; left:14px; top:14px; color:#928d9a; }
    .search-wrap input { width:100%; height:46px; background:var(--surface); border:1px solid var(--line); outline:none; border-radius:15px; padding:0 14px 0 42px; color:var(--ink); font-size:12px; }
    .search-wrap input:focus { border-color:#b9add7; box-shadow:0 0 0 3px rgba(185,173,215,.18); }
    .filter-row { display:flex; gap:7px; overflow-x:auto; padding:1px 0 5px; scrollbar-width:none; }
    .filter-row::-webkit-scrollbar { display:none; }
    .filter-chip { flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--ink-muted); border-radius:999px; padding:8px 12px; font-size:10px; font-weight:800; transition:background-color .38s ease, color .38s ease, border-color .38s ease, transform .38s cubic-bezier(.2,.7,.2,1); }
    .filter-chip:active { transform:translateY(1px); }
    .filter-chip.active { color:#fff; border-color:var(--plum); background:var(--plum); }
    .filter-chip .count { margin-left:4px; opacity:.68; font-size:9px; }
    .unique-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 2px 10px; }
    .unique-toggle { display:inline-flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:10px; font-weight:750; cursor:pointer; }
    .unique-toggle input { position:absolute; opacity:0; width:1px; height:1px; }
    .unique-toggle .switch { width:30px; height:18px; border-radius:99px; background:#d7d2dc; position:relative; transition:background .34s ease; }
    .unique-toggle .switch:after { content:''; position:absolute; width:14px; height:14px; left:2px; top:2px; border-radius:50%; background:white; transition:transform .34s cubic-bezier(.2,.7,.2,1); box-shadow:0 1px 3px #0002; }
    .unique-toggle input:checked + .switch { background:var(--plum); }
    .unique-toggle input:checked + .switch:after { transform:translateX(12px); }
    .filter-toolbar { display:flex; align-items:center; justify-content:space-between; gap:9px; margin: 9px 0 12px; }
    .availability-tabs { background:var(--surface-2); padding:3px; border-radius:12px; display:flex; gap:2px; }
    .availability-tabs button { border:0; background:transparent; color:#817c86; border-radius:9px; padding:7px 9px; font-size:9px; font-weight:800; white-space:nowrap; }
    .availability-tabs button.active { background:var(--surface); color:var(--plum); box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .sort-select { border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:8px 10px; color:var(--ink); font-size:10px; font-weight:750; outline:none; width:min(48%,180px); min-width:132px; }
    .sort-helper { color:var(--muted); font-size:9px; line-height:1.4; margin:-4px 2px 11px; }
    .results-label { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; font-weight:750; margin: 0 2px 10px; }
    .bar-list { display:grid; gap:9px; }
    .bar-card { width:100%; text-align:left; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:19px; display:flex; align-items:center; gap:12px; padding:12px; min-width:0; transition:transform .38s cubic-bezier(.2,.7,.2,1), box-shadow .38s ease, background-color .38s ease, border-color .38s ease; }
    .bar-card:active { transform:translateY(1px); }
    .bar-card:focus-visible, .icon-button:focus-visible, .nav-item:focus-visible, button:focus-visible, select:focus-visible { outline:2px solid var(--plum); outline-offset:3px; }
    .bar-list { transition:opacity .34s ease, transform .34s cubic-bezier(.2,.7,.2,1); }
    .bar-list.is-updating { opacity:.68; transform:translateY(2px); }
    .bar-card .mini-art { width:58px; height:62px; flex-basis:58px; border-radius:15px; }
    .bar-card .mini-art:before { width:43px; height:33px; }
    .bar-info { flex:1; min-width:0; }
    .bar-info .meta { display:flex; align-items:center; gap:6px; min-height:17px; margin-bottom:4px; }
    .bar-info h3 { margin:0; font-size:14px; line-height:1.2; letter-spacing:-.03em; font-weight:820; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bar-info p { margin:5px 0 0; color:var(--muted); font-size:10px; }
    .bar-info p b { color:var(--ink-soft); font-weight:800; }
    .metric-line { display:flex; flex-wrap:wrap; gap:5px 9px; margin-top:6px; color:var(--muted); font-size:9px; font-weight:750; line-height:1.35; }
    .metric-line span { white-space:nowrap; }
    .bar-right { flex:0 0 auto; text-align:right; align-self:stretch; display:flex; flex-direction:column; justify-content:center; align-items:flex-end; }
    .bar-right strong { font-size:14px; letter-spacing:-.02em; font-weight:650; }
    .bar-right small { color:var(--muted); font-size:9px; margin-top:3px; }
    .price-foot { margin-top:7px; display:flex; align-items:center; gap:5px; color:#77717e; font-size:9px; font-weight:750; }
    .availability-dot { width:6px; height:6px; border-radius:50%; display:inline-block; background:#8ab79b; }
    .availability-dot.off { background:#d5c5b5; }
    .empty { background:var(--surface); border:1px dashed #d9d4df; border-radius:18px; padding:28px 18px; color:var(--muted); text-align:center; line-height:1.5; }
    .empty b { color:var(--ink); display:block; margin-bottom:4px; }
    .taste-hero { background:var(--lavender); border-radius:23px; padding:20px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .taste-hero h2 { margin:7px 0 4px; font-size:26px; letter-spacing:-.06em; }
    .taste-hero p { margin:0; color:#776f86; font-size:11px; }
    .taste-score { width:70px; height:70px; border-radius:23px; background:var(--surface); display:grid; place-content:center; text-align:center; box-shadow:0 5px 13px rgba(74,63,95,.07); }
    .taste-score b { font-size:24px; line-height:1; letter-spacing:-.07em; }
    .taste-score span { font-size:8px; color:var(--muted); font-weight:800; margin-top:4px; }
    .taste-tip { display:flex; gap:10px; align-items:center; padding:12px 14px; border-radius:16px; background:var(--surface); border:1px solid var(--line); margin:13px 0 17px; color:#716b79; font-size:10px; line-height:1.4; }
    .taste-tip .tip-dot { width:25px; height:25px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center; background:#f4f0d9; color:#8a7939; font-weight:900; }
    .bottom-nav { position:fixed; z-index:10; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,620px); padding:10px 18px calc(10px + env(safe-area-inset-bottom)); background:var(--nav-surface); backdrop-filter:blur(18px); border-top:1px solid rgba(225,222,216,.8); display:grid; grid-template-columns:repeat(2,1fr); }
    .nav-item { border:0; background:transparent; color:#9b96a1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:4px 0; font-size:9px; font-weight:800; transition:color .38s ease, transform .38s cubic-bezier(.2,.7,.2,1); }
    .nav-item:active { transform:translateY(1px); }
    .nav-item svg { width:19px; height:19px; stroke-width:1.8; }
    .nav-item.active { color:var(--plum); }
    .nav-item.active svg { background:var(--lavender); box-sizing:content-box; padding:6px 15px; width:19px; height:19px; border-radius:13px; }
    .modal-backdrop { position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center; background:rgba(35,31,43,.42); backdrop-filter:blur(4px); padding:12px 10px 0; }
    .sheet { width:min(100%,600px); max-height:90vh; overflow:auto; background:var(--paper); border-radius:27px 27px 0 0; padding:11px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow:0 -12px 45px rgba(28,24,37,.18); animation:sheetin .46s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes sheetin { from { transform:translateY(24px); opacity:0; } to { transform:none; opacity:1; } }
    .modal-backdrop { animation:backdropin .38s ease both; }
    @keyframes backdropin { from { opacity:0; } to { opacity:1; } }
    .sheet-handle { width:37px; height:4px; border-radius:8px; background:#d6d2d9; margin:0 auto 14px; }
    .sheet-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .sheet-title { display:flex; align-items:center; gap:12px; }
    .sheet-title .mini-art { width:66px; height:70px; flex-basis:66px; }
    .sheet-title h2 { margin:6px 0 3px; font-size:22px; letter-spacing:-.055em; line-height:1.1; }
    .sheet-title p { margin:0; color:var(--muted); font-size:10px; }
    .close-button { border:0; background:#eeece8; color:#716b78; width:34px; height:34px; border-radius:12px; font-size:21px; line-height:1; }
    .sheet-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:19px 0; }
    .sheet-stat { background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:12px 10px; }
    .sheet-stat b { display:block; font-size:19px; letter-spacing:-.055em; }
    .sheet-stat span { color:var(--muted); font-size:9px; font-weight:700; }
    .detail-section { margin-top:17px; }
    .detail-section h3 { margin:0 0 9px; font-size:12px; font-weight:850; letter-spacing:-.02em; }
    .price-row { display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--line); padding:12px 13px; border-radius:13px; margin-bottom:7px; }
    .price-row span { color:#756f7c; font-size:11px; font-weight:750; }
    .price-row b { font-size:14px; font-weight:650; }
    .availability-pills { display:flex; gap:7px; flex-wrap:wrap; }
    .availability-pills span { border-radius:999px; padding:7px 10px; background:#e5f1e8; color:#527c61; font-size:10px; font-weight:800; }
    .availability-pills span.off { background:#efede9; color:#9b949e; }
    .tasting-box { margin-top:17px; border-radius:18px; padding:15px; background:var(--lavender); }
    .tasting-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .tasting-head b { font-size:12px; }
    .tasting-head span { color:#746b85; font-size:10px; }
    .toggle-button { margin-top:12px; width:100%; height:39px; border:1px solid #c8bddc; color:var(--plum); background:var(--surface); border-radius:12px; font-size:11px; font-weight:850; }
    .rating-wrap { margin-top:13px; }
    .rating-label { color:#766e84; font-size:10px; font-weight:800; margin-bottom:8px; }
    .rating-buttons { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; }
    .rating-buttons button { min-width:0; height:29px; border-radius:8px; border:1px solid #d9d1e9; background:rgba(255,255,255,.75); color:#786f88; font-size:10px; font-weight:800; padding:0; }
    .rating-buttons button.active { background:var(--plum); border-color:var(--plum); color:#fff; }
    .toast { position:fixed; z-index:50; bottom:88px; left:50%; transform:translate(-50%,12px); opacity:0; pointer-events:none; background:#292536; color:white; padding:10px 15px; border-radius:999px; font-size:11px; font-weight:750; transition:opacity .38s ease, transform .38s cubic-bezier(.2,.7,.2,1); white-space:nowrap; }
    .toast.show { opacity:1; transform:translate(-50%,0); }

    .read-only-log { margin-top:11px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .read-only-log span { color:var(--muted); font-size:10px; line-height:1.4; }
    .read-only-log span.rating-good, .read-only-log span.rating-mid, .read-only-log span.rating-low { display:inline-flex; align-items:center; padding:6px 9px; border-radius:999px; font-weight:750; }
    .edit-log-button, .edit-option, .discard-button, .save-button, .confirm-button { border-radius:12px; font-size:11px; font-weight:850; transition:background-color .38s ease, color .38s ease, border-color .38s ease, transform .38s cubic-bezier(.2,.7,.2,1), box-shadow .38s ease; }
    .edit-log-button { padding:9px 13px; border:1px solid #c8bddc; color:var(--plum); background:var(--surface); white-space:nowrap; }
    .edit-note { margin:8px 0 12px; color:var(--muted); font-size:10px; line-height:1.45; }
    .edit-state { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .edit-option { min-height:39px; border:1px solid var(--line); background:var(--surface); color:var(--muted); }
    .edit-option.active { background:var(--plum); border-color:var(--plum); color:#fff; }
    .edit-option.active { background:var(--plum); border-color:var(--plum); color:#fff; }
    .edit-rating-title { font-size:10px; font-weight:850; color:var(--ink-soft); margin:14px 0 8px; }
    .edit-actions { display:grid; grid-template-columns:1fr 1.2fr; gap:8px; margin-top:16px; }

  const visibleCount=filteredBars().length;
  const count=$('#resultCount');
  if(count) count.textContent=`${visibleCount} ${uniqueFlavoursOnly?'unique flavours':(tab==='tasted'?'tried bars':'bars')}`;
  const summary=$('.page-title p');
  if(summary && tab==='browse') summary.textContent=`${visibleCount} ${uniqueFlavoursOnly?'unique flavours':'bar variants'}, with the details worth knowing.`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
   if(token===listUpdateToken) grid.classList.remove('is-updating');
  }));
 },140);
}
function refreshFilterStates() {
 document.querySelectorAll('[data-series]').forEach(el=>el.classList.toggle('active',el.dataset.series===seriesFilter));
 document.querySelectorAll('[data-availability]').forEach(el=>el.classList.toggle('active',el.dataset.availability===availabilityFilter));
 const unique=$('#uniqueFlavours'); if(unique) unique.checked=uniqueFlavoursOnly;
}
function detailHtml(b) {
 const tried=b.tried;
 const best20=bestPrice20(b);
 const logStatus = !tried ? 'Not tried yet' : (b.rating != null ? `Rated ${b.rating}/10` : 'Tried · not rated yet');
 const tastingControls = isEditing ? `
   <p class="edit-note">Changes stay in draft until you tap Save.</p>
   <div class="edit-state"><button class="edit-option ${editDraft.tried?'':'active'}" data-draft-tried="no">Not tried</button><button class="edit-option ${editDraft.tried?'active':''}" data-draft-tried="yes">Tried it</button></div>
   ${editDraft.tried ? `<div class="edit-rating-title">RATING · OUT OF 10</div><div class="rating-buttons">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button class="${editDraft.rating===n ? `active ${ratingTone(n)}` : ''}" data-draft-rate="${n}">${n}</button>`).join('')}</div>` : `<p class="edit-note">A rating is available when you mark this bar as tried.</p>`}
   <div class="edit-actions"><button class="discard-button" data-discard>Discard</button><button class="save-button" data-save ${hasDraftChanges()?'':'disabled'}>Save changes</button></div>` : `
   <div class="read-only-log"><span class="${tried && b.rating != null ? ratingTone(b.rating) : ''}">${tried ? (b.rating != null ? `Tried · ${b.rating}/10 rating.` : 'Tried · not rated yet.') : 'Not tried yet.'}</span><button class="edit-log-button" data-edit> Edit status & rating </button></div>`;
 return `<div class="modal-backdrop" data-close="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(b.flavor)} details"><div class="sheet-handle"></div>
  <div class="sheet-top"><div class="sheet-title">${art(b.series)}<div><div class="meta">${seriesTag(b.series)}${tried?`<span class="tag tried ${b.rating != null ? ratingTone(b.rating) : ''}">${b.rating != null ? 'Tried' : 'Tried · unrated'}</span>`:''}</div><h2>${escapeHtml(b.flavor)}</h2><p>${b.series} series · ${b.protein}g protein per bar</p></div></div><button class="close-button" data-close="button" aria-label="Close">×</button></div>
  <div class="sheet-stats"><div class="sheet-stat"><b>${b.protein}g</b><span>PROTEIN</span></div><div class="sheet-stat"><b>${b.cal}</b><span>CALORIES</span></div><div class="sheet-stat"><b>${proteinEfficiency(b).toFixed(2)}</b><span>PROTEIN / 100 KCAL</span></div></div>
  <div class="detail-section"><h3>Price comparison</h3><div class="price-row"><span>Website · per bar</span><b>${money(b.website?b.wPrice:null)}</b></div><div class="price-row"><span>Blinkit · per bar</span><b>${money(b.blinkit?b.bPrice:null)}</b></div><div class="price-row"><span>Website · per 20g protein</span><b>${money(b.website?b.w20:null)}</b></div><div class="price-row"><span>Blinkit · per 20g protein</span><b>${money(b.blinkit?b.b20:null)}</b></div>${best20?`<div class="price-row"><span>Best available · per 20g</span><b>${money(best20.value)} · ${best20.source}</b></div>`:''}</div>
  <div class="detail-section"><h3>Availability</h3><div class="availability-pills"><span class="${b.blinkit?'':'off'}">${b.blinkit?'✓':'—'} Blinkit</span><span class="${b.website?'':'off'}">${b.website?'✓':'—'} Website</span></div></div>
  <div class="tasting-box"><div class="tasting-head"><b>Your status & rating</b><span>${logStatus}</span></div>${tastingControls}</div>
 </section></div>`;
}
function renderDetails() {
 const b=getBar(activeBarId); if(!b) return;
 const oldSheet=$('.sheet'); const oldScroll=oldSheet ? oldSheet.scrollTop : 0;
 $('#modalRoot').innerHTML=detailHtml(b);
 const newSheet=$('.sheet'); if(newSheet) newSheet.scrollTop=oldScroll;
}
function openDetails(id) { activeBarId=Number(id); const b=getBar(activeBarId); if(!b)return; isEditing=false; editDraft=null; $('#modalRoot').innerHTML=detailHtml(b); document.body.style.overflow='hidden'; }
function closeDetails() { $('#modalRoot').innerHTML=''; document.body.style.overflow=''; activeBarId=null; isEditing=false; editDraft=null; }
function hasDraftChanges() {
 if (!isEditing || !editDraft || activeBarId==null) return false;
 const current=getBar(activeBarId);
 return !!current && (Boolean(current.tried)!==Boolean(editDraft.tried) || (current.rating??null)!==(editDraft.rating??null));
}
function startEditing() { const b=getBar(activeBarId); if(!b)return; editDraft={tried:Boolean(b.tried),rating:b.rating??null}; isEditing=true; renderDetails(); }
function changeDraftTried(value) { if(!editDraft)return; editDraft.tried=value; renderDetails(); }
function changeDraftRating(score) { if(!editDraft)return; editDraft.tried=true; editDraft.rating=score; renderDetails(); }
function saveDraft() {
 if(!isEditing || !editDraft || activeBarId==null || !hasDraftChanges())return;
 edits[activeBarId]={...(edits[activeBarId]||{}),tried:Boolean(editDraft.tried),rating:editDraft.tried ? (editDraft.rating??null) : null};
 persist(); isEditing=false; editDraft=null; render(); renderDetails(); toast('Changes saved');
}
function discardDraft() { isEditing=false; editDraft=null; renderDetails(); }
function showDiscardPrompt() {
 if($('#discardPrompt'))return;
 $('#modalRoot').insertAdjacentHTML('beforeend', `<div class="confirm-backdrop" id="discardPrompt"><div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="discardTitle"><h3 id="discardTitle">Discard your changes?</h3><p>Your changes haven’t been saved. You can keep editing or discard the draft.</p><div class="confirm-actions"><button class="confirm-button" data-confirm="keep">Keep editing</button><button class="confirm-button danger" data-confirm="discard">Discard changes</button></div></div></div>`);
}
function requestCloseDetails() { if(isEditing && hasDraftChanges()){showDiscardPrompt();return;} closeDetails(); }
function handleBackPressed() { if($('#discardPrompt')) { $('#discardPrompt').remove(); return true; } if(activeBarId!=null) { requestCloseDetails(); return true; } return false; }
function persist() { try { localStorage.setItem(STORE_KEY,JSON.stringify(edits)); } catch(e){} }
function toast(message) { const el=$('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),2200); }
document.addEventListener('click',e=>{
 const theme=e.target.closest('[data-action="theme"]'); if(theme){toggleTheme();return;}
 const confirm=e.target.closest('[data-confirm]'); if(confirm){if(confirm.dataset.confirm==='discard')closeDetails();else $('#discardPrompt')?.remove();return;}
 const nav=e.target.closest('[data-tab]'); if(nav){ tab=nav.dataset.tab; if(tab!=='browse'){seriesFilter='All';availabilityFilter='Any';searchText='';sortMode='efficiency';} render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
 const series=e.target.closest('[data-series]'); if(series){seriesFilter=series.dataset.series;refreshFilterStates();updateListOnly();return;}
 const availability=e.target.closest('[data-availability]'); if(availability){availabilityFilter=availability.dataset.availability;refreshFilterStates();updateListOnly();return;}
 const uniqueToggle=e.target.closest('#uniqueFlavours'); if(uniqueToggle){uniqueFlavoursOnly=uniqueToggle.checked;try{localStorage.setItem(UNIQUE_KEY,String(uniqueFlavoursOnly));}catch(e){} updateListOnly();return;}
 const open=e.target.closest('[data-open]'); if(open){openDetails(open.dataset.open);return;}
 const close=e.target.closest('[data-close]'); if(close && (close.dataset.close==='button'||e.target===close)){requestCloseDetails();return;}
 if(e.target.closest('[data-edit]')){startEditing();return;}
 const draftTried=e.target.closest('[data-draft-tried]'); if(draftTried){changeDraftTried(draftTried.dataset.draftTried==='yes');return;}
 const draftRate=e.target.closest('[data-draft-rate]'); if(draftRate){changeDraftRating(Number(draftRate.dataset.draftRate));return;}
 if(e.target.closest('[data-save]')){saveDraft();return;}
 if(e.target.closest('[data-discard]')){discardDraft();return;}
});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){searchText=e.target.value;updateListOnly();}});
document.addEventListener('change',e=>{if(e.target.id==='sortSelect'){sortMode=e.target.value;updateListOnly();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#discardPrompt')){$('#discardPrompt').remove();return;}requestCloseDetails();}});
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body>
</html>
