<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <script>
    /* Apply the saved theme before anything is painted so a dark-mode user never sees a light frame. */
    (function(){ var d=document.documentElement; d.className='preload';
      try {
        var p=localStorage.getItem('barbook-theme-v1');
        var sysDark=window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        if (p==='dark' || (p!=='light' && sysDark)) d.dataset.theme='dark';
      } catch(e) {} })();
  </script>
  <meta name="description" content="A simple personal tracker for The Whole Truth protein bars.">
  <title>Barbook — The Whole Truth tracker</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f6f2;
      --surface: #ffffff;
      --surface-2: #eeece7;

      --plum: #49415f;
      --plum-dark: #292536;
      --lavender: #eeeaf7;
      --lime: #dafa66;

      --nav-line: rgba(225,222,216,.8);
      --shadow: 0 12px 34px rgba(43, 37, 54, .07);
    }
    html.preload *, html.preload *::before, html.preload *::after { transition:none !important; animation:none !important; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { min-height: 100%; background: var(--paper); }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); transition:background-color .42s ease, color .42s ease;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; letter-spacing: -.01em;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(100%, 620px); min-height: 100vh; margin: 0 auto; padding: 0 19px 108px; }
    .topbar { height: 76px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      width: 39px; height: 39px; border-radius: 14px; background: var(--plum-dark); display: grid; place-items: center;
      box-shadow: 0 5px 12px rgba(41,37,54,.16); position: relative; overflow: hidden;
    }
    .brand-mark:before { content:""; width: 20px; height: 23px; border-radius: 7px; background: var(--lime); transform: rotate(-8deg); }
    .brand-mark:after { content:""; position:absolute; width: 4px; height: 14px; border-radius: 9px; background: var(--plum-dark); box-shadow: 6px 0 0 var(--plum-dark), -6px 0 0 var(--plum-dark); }
    .brand-name { font-size: 15px; font-weight: 850; letter-spacing: .12em; line-height: 1.05; }
    .brand-sub { color: var(--muted); font-size: 9px; font-weight: 750; letter-spacing: .12em; margin-top: 4px; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .icon-button { height: 40px; width: 40px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display:grid; place-items:center; color:var(--plum); transition:background-color .38s ease, border-color .38s ease, color .38s ease, transform .38s cubic-bezier(.2,.7,.2,1); }
    .icon-button:active { transform:translateY(1px); }
    .icon-button svg { width:18px; height:18px; }
    .eyebrow { color: #8d8799; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; }
      position: relative; overflow: hidden; border-radius: 27px; background: var(--plum-dark); color: white;
      min-height: 205px; padding: 24px 23px; box-shadow: 0 15px 30px rgba(44,39,58,.13);
    }
    .mini-art { flex:0 0 64px; height:70px; border-radius:17px; display:grid; place-items:center; position:relative; overflow:hidden; background:var(--lavender); }
    .mini-art:before { content:""; height:39px; width:48px; border-radius:13px; background:var(--art,#c9b8e8); transform:rotate(-22deg); box-shadow:0 6px 10px rgba(54,45,75,.12); }
    .mini-art:after { content:""; position:absolute; width:33px; height:12px; border:1px solid rgba(48,40,65,.25); border-radius:6px; transform:rotate(-22deg); }
    .mini-art.pro { --art:#dafa66; background:#f0f4df; }
    .mini-art.core { --art:#c8b8e8; background:#f0ebf9; }
    .mini-art.millet { --art:#edc99c; background:#f8f0e6; }
    .mini-art.mini { --art:#eab9c8; background:#f8edf0; }
    .tag { display:inline-flex; align-items:center; padding:4px 7px; border-radius:999px; color:#5d526e; background:var(--lavender); font-size:9px; line-height:1; letter-spacing:.08em; font-weight:850; }
    .tag.tried { background:#e1f1e7; color:#47785e; letter-spacing:0; }

    .tag.tried.rating-low, .read-only-log span.rating-low { background:#f9e0df; color:#963b38; }
    .rating-buttons button.active.rating-good { background:#dff2e5; border-color:#a9d8b8; color:#286742; }
    .rating-buttons button.active.rating-mid { background:#fff0c9; border-color:#e8d18b; color:#7d5b10; }
    .rating-buttons button.active.rating-low { background:#f9e0df; border-color:#e6b5b2; color:#963b38; }
    .page-title { padding: 9px 1px 16px; }
    .page-title h1 { margin:7px 0 5px; font-size:29px; line-height:1.06; font-weight:850; letter-spacing:-.06em; }
    .page-title p { color:var(--muted); margin:0; font-size:12px; }
    .search-wrap { position:relative; margin: 6px 0 13px; }

    .search-wrap input { width:100%; height:46px; background:var(--surface); border:1px solid var(--line); outline:none; border-radius:15px; padding:0 14px 0 42px; color:var(--ink); font-size:12px; }
    .search-wrap input:focus { border-color:#b9add7; box-shadow:0 0 0 3px rgba(185,173,215,.18); }
    .filter-row { display:flex; gap:7px; overflow-x:auto; padding:1px 0 5px; scrollbar-width:none; }

    .filter-chip { flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--ink-muted); border-radius:999px; padding:8px 12px; font-size:10px; font-weight:800; transition:background-color .38s ease, color .38s ease, border-color .38s ease, transform .38s cubic-bezier(.2,.7,.2,1); }
    .filter-chip:active { transform:translateY(1px); }

    .unique-toggle input { position:absolute; opacity:0; width:1px; height:1px; }
    .unique-toggle .switch { width:30px; height:18px; border-radius:99px; background:#d7d2dc; position:relative; transition:background .34s ease; }
    .unique-toggle .switch:after { content:''; position:absolute; width:14px; height:14px; left:2px; top:2px; border-radius:50%; background:white; transition:transform .34s cubic-bezier(.2,.7,.2,1); box-shadow:0 1px 3px #0002; }
    .unique-toggle input:checked + .switch { background:var(--plum); }
    .unique-toggle input:checked + .switch:after { transform:translateX(12px); }
    .filter-toolbar { display:flex; align-items:center; justify-content:space-between; gap:9px; margin: 9px 0 12px; }
    .availability-tabs { background:var(--surface-2); padding:3px; border-radius:12px; display:flex; gap:2px; }
    .availability-tabs button { border:0; background:transparent; color:#817c86; border-radius:9px; padding:7px 9px; font-size:9px; font-weight:800; white-space:nowrap; }
    .availability-tabs button.active { background:var(--surface); color:var(--plum); box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .sort-select { border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:8px 10px; color:var(--ink); font-size:10px; font-weight:750; outline:none; width:min(48%,180px); min-width:132px; }
    .results-label { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; font-weight:750; margin: 0 2px 10px; }
    .bar-list { display:grid; gap:9px; }
    .bar-card { width:100%; text-align:left; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:19px; display:flex; align-items:center; gap:12px; padding:12px; min-width:0; transition:transform .38s cubic-bezier(.2,.7,.2,1), box-shadow .38s ease, background-color .38s ease, border-color .38s ease; }
    .bar-card:active { transform:translateY(1px); }
    .bar-card:focus-visible, .icon-button:focus-visible, .nav-item:focus-visible, button:focus-visible, select:focus-visible { outline:2px solid var(--plum); outline-offset:3px; }
    .bar-card .mini-art { width:58px; height:62px; flex-basis:58px; border-radius:15px; }
    .bar-card .mini-art:before { width:43px; height:33px; }

    .bar-info h3 { margin:0; font-size:14px; line-height:1.2; letter-spacing:-.03em; font-weight:820; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .bar-right { flex:0 0 auto; text-align:right; align-self:stretch; display:flex; flex-direction:column; justify-content:center; align-items:flex-end; }

    .availability-dot { width:6px; height:6px; border-radius:50%; display:inline-block; background:#8ab79b; }
    .availability-dot.off { background:#d5c5b5; }

    .taste-hero h2 { margin:7px 0 4px; font-size:26px; letter-spacing:-.06em; }
    .taste-hero p { margin:0; color:#776f86; font-size:11px; }
    .taste-score { width:70px; height:70px; border-radius:23px; background:var(--surface); display:grid; place-content:center; text-align:center; box-shadow:0 5px 13px rgba(74,63,95,.07); }
    .taste-score b { font-size:24px; line-height:1; letter-spacing:-.07em; }
    .taste-score span { font-size:8px; color:var(--muted); font-weight:800; margin-top:4px; }
    .taste-tip { display:flex; gap:10px; align-items:center; padding:12px 14px; border-radius:16px; background:var(--surface); border:1px solid var(--line); margin:13px 0 17px; color:#716b79; font-size:10px; line-height:1.4; }
    .taste-tip .tip-dot { width:25px; height:25px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center; background:#f4f0d9; color:#8a7939; font-weight:900; }
    .bottom-nav { position:fixed; z-index:10; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,620px); padding:10px 18px calc(10px + env(safe-area-inset-bottom)); background:var(--nav-surface); backdrop-filter:blur(18px); border-top:1px solid var(--nav-line); display:grid; grid-template-columns:repeat(2,1fr); }
    .nav-item { border:0; background:transparent; color:#9b96a1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:4px 0; font-size:9px; font-weight:800; transition:color .38s ease, transform .38s cubic-bezier(.2,.7,.2,1); }
    .nav-item:active { transform:translateY(1px); }
    .nav-item svg { width:19px; height:19px; stroke-width:1.8; }
    .nav-item.active { color:var(--plum); }
    .nav-item.active svg { background:var(--lavender); box-sizing:content-box; padding:6px 15px; width:19px; height:19px; border-radius:13px; }
    .modal-backdrop { position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center; background:rgba(35,31,43,.42); backdrop-filter:blur(4px); padding:12px 10px 0; }
    .sheet { width:min(100%,600px); max-height:90vh; overflow:auto; background:var(--paper); border-radius:27px 27px 0 0; padding:11px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow:0 -12px 45px rgba(28,24,37,.18); }
    .sheet.enter { animation:sheetin .34s cubic-bezier(.2,.7,.2,1) both; }

    .modal-backdrop.enter { animation:backdropin .3s ease both; }
    @keyframes backdropin { from { opacity:0; } to { opacity:1; } }
    .sheet-handle { width:37px; height:4px; border-radius:8px; background:#d6d2d9; margin:0 auto 14px; }
    .sheet-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }

    .sheet-title p { margin:0; color:var(--muted); font-size:10px; }

    .sheet-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:19px 0; }
    .sheet-stat { background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:12px 10px; }
    .sheet-stat b { display:block; font-size:19px; letter-spacing:-.055em; }
    .sheet-stat span { color:var(--muted); font-size:9px; font-weight:700; }
    .detail-section { margin-top:17px; }
    .detail-section h3 { margin:0 0 9px; font-size:12px; font-weight:850; letter-spacing:-.02em; }
    .price-row { display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--line); padding:12px 13px; border-radius:13px; margin-bottom:7px; }

    .rating-buttons button.active { background:var(--plum); border-color:var(--plum); color:#fff; }

    .edit-state.three { grid-template-columns:repeat(3,1fr); }

    .setting-row small { display:block; margin-top:3px; color:var(--muted); font-size:10px; line-height:1.4; }
    .top-actions .icon-button + .icon-button { margin-left:0; }

    .read-only-log span { color:var(--muted); font-size:10px; line-height:1.4; }
    .read-only-log span.rating-good, .read-only-log span.rating-mid, .read-only-log span.rating-low { display:inline-flex; align-items:center; padding:6px 9px; border-radius:999px; font-weight:750; }
    .edit-log-button, .edit-option, .discard-button, .save-button, .confirm-button { border-radius:12px; font-size:11px; font-weight:850; transition:background-color .38s ease, color .38s ease, border-color .38s ease, transform .38s cubic-bezier(.2,.7,.2,1), box-shadow .38s ease; }
    .edit-log-button { padding:9px 13px; border:1px solid #c8bddc; color:var(--plum); background:var(--surface); white-space:nowrap; }

    .discard-button, .save-button { min-height:43px; border:1px solid var(--line); }
    .discard-button { background:var(--surface); color:var(--ink-soft); }
    .save-button { background:var(--plum-dark); color:#fff; border-color:var(--plum-dark); }
    .save-button:disabled { opacity:.42; cursor:not-allowed; }
    .discard-button:active, .save-button:active, .edit-option:active, .edit-log-button:active { transform:translateY(1px); }
    .confirm-backdrop { position:fixed; z-index:45; inset:0; display:grid; place-items:center; padding:22px; background:rgba(25,22,32,.48); backdrop-filter:blur(5px); animation:backdropin .32s ease both; }
    .confirm-card { width:min(100%,360px); background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:22px; padding:20px; box-shadow:var(--shadow); animation:confirmin .38s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes confirmin { from { opacity:0; transform:translateY(6px) scale(.99); } to { opacity:1; transform:none; } }
    .confirm-card h3 { margin:0 0 6px; font-size:16px; letter-spacing:-.03em; }
    .confirm-card p { margin:0; color:var(--muted); font-size:11px; line-height:1.5; }
    .confirm-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:17px; }
    .confirm-button { min-height:40px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); }
    .confirm-button.danger { background:var(--plum-dark); border-color:var(--plum-dark); color:#fff; }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --paper:#15141b;
      --surface:#211f2a;
      --surface-2:#2a2734;
      --surface-3:#302c3d;
      --ink:#f2eff7;
      --ink-soft:#d0cadb;
      --ink-muted:#c0bacb;
      --muted:#aaa4b3;
      --line:#383443;
      --plum:#c2b4e8;
      --plum-dark:#242130;
      --lavender:#302b40;
      --nav-surface:rgba(29,27,37,.95);
      --nav-line:rgba(70,65,86,.7);
      --shadow:0 14px 38px rgba(0,0,0,.24);
    }
    :root[data-theme="dark"] body { background:var(--paper); color:var(--ink); }

    :root[data-theme="dark"] .search-wrap input,
    :root[data-theme="dark"] .filter-chip,
    :root[data-theme="dark"] .sort-select,
    :root[data-theme="dark"] .bar-card,
    :root[data-theme="dark"] .empty,
    :root[data-theme="dark"] .taste-tip,
    :root[data-theme="dark"] .taste-score,
    :root[data-theme="dark"] .sheet-stat,
    :root[data-theme="dark"] .price-row,
    :root[data-theme="dark"] .setting-row,
    :root[data-theme="dark"] .close-button,
    :root[data-theme="dark"] .rating-buttons button,
    :root[data-theme="dark"] .edit-log-button,
    :root[data-theme="dark"] .edit-option,
    :root[data-theme="dark"] .discard-button,
    :root[data-theme="dark"] .confirm-button { background:var(--surface); color:var(--ink); border-color:var(--line); }
    :root[data-theme="dark"] .availability-tabs { background:var(--surface-2); }
    :root[data-theme="dark"] .availability-tabs button { color:var(--muted); }
    :root[data-theme="dark"] .availability-tabs button.active { background:var(--surface-3); color:var(--ink); }
    :root[data-theme="dark"] .filter-chip.active,
    :root[data-theme="dark"] .edit-option.active { background:var(--plum); border-color:var(--plum); color:#201c2a; }
    :root[data-theme="dark"] .bar-info p b,
    :root[data-theme="dark"] .price-row span,
    :root[data-theme="dark"] .price-foot,
    :root[data-theme="dark"] .taste-hero p,
    :root[data-theme="dark"] .taste-tip,
    :root[data-theme="dark"] .empty,

    :root[data-theme="dark"] .tag.tried.rating-good, :root[data-theme="dark"] .read-only-log span.rating-good,
    :root[data-theme="dark"] .rating-buttons button.active.rating-good { background:#244333; border-color:#38664a; color:#b6e8c5; }
    :root[data-theme="dark"] .tag.tried.rating-mid, :root[data-theme="dark"] .read-only-log span.rating-mid,
    :root[data-theme="dark"] .rating-buttons button.active.rating-mid { background:#493b1e; border-color:#78602c; color:#f6df9c; }
    :root[data-theme="dark"] .tag.tried.rating-low, :root[data-theme="dark"] .read-only-log span.rating-low,
    :root[data-theme="dark"] .rating-buttons button.active.rating-low { background:#4a2929; border-color:#744141; color:#f2b4b0; }
    :root[data-theme="dark"] .save-button,
    :root[data-theme="dark"] .confirm-button.danger { background:var(--plum); border-color:var(--plum); color:#201c2a; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }

    @media (min-width:560px) {
      .app { padding-left:25px; padding-right:25px; }
      .bar-list.gridish { grid-template-columns:1fr 1fr; }
      .bar-card { min-height:94px; }
    }
    @media (max-width:360px) {
      .app { padding-left:14px; padding-right:14px; }
      .availability-tabs button { padding-left:7px; padding-right:7px; }
    }
  </style>
</head>
<body>
<div class="app" id="app"></div>
<div class="bottom-nav" id="bottomNav"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
const BARS = [
 {id:1,flavor:"Double Cocoa",series:"PRO",protein:20,blinkit:true,website:true,bPrice:168,wPrice:159,b20:168,w20:159,cal:336,density:5.95,tried:true,rating:9},
 {id:2,flavor:"Peanut Cocoa",series:"PRO",protein:20,blinkit:true,website:true,bPrice:168,wPrice:159,b20:168,w20:159,cal:348,density:5.75,tried:false,rating:null},
 {id:3,flavor:"Coffee Cocoa",series:"PRO",protein:20,blinkit:false,website:true,bPrice:168,wPrice:159,b20:168,w20:159,cal:342,density:5.85,tried:false,rating:null},
 {id:4,flavor:"Hazelnut Cocoa",series:"PRO",protein:20,blinkit:true,website:true,bPrice:205,wPrice:194,b20:205,w20:194,cal:344,density:5.81,tried:true,rating:6},
 {id:5,flavor:"Peanut Cocoa",series:"Core",protein:15,blinkit:true,website:true,bPrice:115,wPrice:110,b20:153,w20:147,cal:244,density:6.15,tried:true,rating:9},
 {id:6,flavor:"Double Cocoa",series:"Core",protein:13,blinkit:true,website:true,bPrice:115,wPrice:103,b20:177,w20:158,cal:256,density:5.08,tried:false,rating:null},
 {id:7,flavor:"Coffee Cocoa",series:"Core",protein:14,blinkit:true,website:true,bPrice:115,wPrice:103,b20:164,w20:147,cal:245,density:5.71,tried:true,rating:3},
 {id:8,flavor:"Peanut Butter",series:"Core",protein:12,blinkit:true,website:true,bPrice:112,wPrice:107,b20:187,w20:178,cal:259,density:4.63,tried:true,rating:4},
 {id:9,flavor:"Coconut Cocoa",series:"Core",protein:12,blinkit:true,website:true,bPrice:112,wPrice:107,b20:187,w20:178,cal:253,density:4.74,tried:false,rating:null},
 {id:10,flavor:"Cranberry Raisin",series:"Core",protein:12,blinkit:true,website:true,bPrice:151,wPrice:144,b20:252,w20:240,cal:254,density:4.72,tried:false,rating:null},
 {id:11,flavor:"Hazelnut Cocoa",series:"Core",protein:12,blinkit:false,website:true,bPrice:null,wPrice:155,b20:null,w20:258,cal:265,density:4.53,tried:false,rating:null},
 {id:12,flavor:"Orange Cocoa",series:"Core",protein:12,blinkit:false,website:true,bPrice:null,wPrice:137,b20:null,w20:228,cal:256,density:4.69,tried:false,rating:null},
 {id:13,flavor:"Lemon Cranberry",series:"Core",protein:12,blinkit:false,website:true,bPrice:null,wPrice:137,b20:null,w20:228,cal:253,density:4.74,tried:false,rating:null},
 {id:14,flavor:"Subko Tiramisu",series:"Core",protein:10,blinkit:false,website:true,bPrice:null,wPrice:176,b20:null,w20:352,cal:262,density:3.82,tried:false,rating:null},
 {id:15,flavor:"Walnut Fudge",series:"Core",protein:11,blinkit:false,website:true,bPrice:null,wPrice:165,b20:null,w20:300,cal:278,density:3.96,tried:false,rating:null},
 {id:16,flavor:"Almond Cocoa",series:"Millet",protein:12,blinkit:true,website:true,bPrice:144,wPrice:128,b20:240,w20:213,cal:282,density:4.26,tried:false,rating:null},
 {id:17,flavor:"Peanut Cocoa",series:"Millet",protein:13,blinkit:true,website:true,bPrice:144,wPrice:137,b20:222,w20:211,cal:270,density:4.81,tried:false,rating:null},
 {id:18,flavor:"Hazelnut",series:"Millet",protein:12,blinkit:false,website:true,bPrice:null,wPrice:167,b20:null,w20:278,cal:276,density:4.35,tried:false,rating:null},
 {id:19,flavor:"Mocha",series:"Millet",protein:13,blinkit:false,website:true,bPrice:null,wPrice:147,b20:null,w20:226,cal:268,density:4.85,tried:false,rating:null},
 {id:20,flavor:"Double Cocoa",series:"Mini",protein:6,blinkit:true,website:true,bPrice:71,wPrice:66,b20:237,w20:220,cal:133,density:4.51,tried:false,rating:null},
 {id:21,flavor:"Peanut Cocoa",series:"Mini",protein:6,blinkit:true,website:true,bPrice:71,wPrice:66,b20:237,w20:220,cal:127,density:4.72,tried:false,rating:null},
 {id:22,flavor:"Coffee Cocoa",series:"Mini",protein:6,blinkit:true,website:true,bPrice:71,wPrice:66,b20:237,w20:220,cal:128,density:4.69,tried:false,rating:null},
 {id:23,flavor:"Cranberry Raisin",series:"Mini",protein:6,blinkit:true,website:true,bPrice:71,wPrice:66,b20:237,w20:220,cal:122,density:4.92,tried:false,rating:null}
];

const APP_VERSION = '1.5';
const STORE_KEY = 'barbook-v1-personal-edits';
const UNIQUE_KEY = 'barbook-unique-flavours-v1';
const THEME_KEY = 'barbook-theme-v1';
const BACKUP_FORMAT = 1;
const MAX_BACKUP_CHARS = 1000000;

const storage = {
 get(key) { try { return localStorage.getItem(key); } catch(e) { return null; } },
 set(key, value) { try { localStorage.setItem(key, value); } catch(e) {} }
};

let edits = {};
try { edits = JSON.parse(storage.get(STORE_KEY) || '{}') || {}; } catch(e) { edits = {}; }
if (typeof edits !== 'object' || Array.isArray(edits)) edits = {};
let uniqueFlavoursOnly = storage.get(UNIQUE_KEY) === 'true';
const systemDarkQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
const normalizeThemePref = v => (v === 'light' || v === 'dark' || v === 'system') ? v : 'system';
let themePref = normalizeThemePref(storage.get(THEME_KEY));
const effectiveTheme = () => themePref === 'system' ? (systemDarkQuery && systemDarkQuery.matches ? 'dark' : 'light') : themePref;
let currentTheme = effectiveTheme();
let tab = 'browse', seriesFilter = 'All', availabilityFilter = 'Any', sortMode = 'efficiency', searchText = '';
let activeBarId = null, settingsOpen = false, isEditing = false, editDraft = null;
let confirmAction = null, pendingImport = null;
document.documentElement.dataset.theme = currentTheme;

const $ = (s, root=document) => root.querySelector(s);
const money = n => n == null ? '—' : '₹' + n;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const allBars = () => BARS.map(b => ({...b,...(edits[b.id] || {})}));
const getBar = id => allBars().find(b => b.id === Number(id));
const triedBars = () => allBars().filter(b => b.tried);
const ratedBars = () => triedBars().filter(b => b.rating != null);
const avgRating = () => { const a=ratedBars(); return a.length ? (a.reduce((s,b)=>s+Number(b.rating),0)/a.length).toFixed(2) : '—'; };
const proteinEfficiency = b => (Number(b.protein) / Number(b.cal)) * 100;
const ratingTone = score => Number(score) >= 8 ? 'rating-good' : (Number(score) >= 6 ? 'rating-mid' : 'rating-low');
function escapeHtml(s) { return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function price20Options(b) { const values=[]; if (availabilityFilter !== 'Website' && b.blinkit && b.b20 != null) values.push({value:Number(b.b20),source:'Blinkit'}); if (availabilityFilter !== 'Blinkit' && b.website && b.w20 != null) values.push({value:Number(b.w20),source:'Website'}); return values; }
function bestPrice20(b) { return price20Options(b).sort((a,b)=>a.value-b.value)[0] || null; }

const svg = (name) => {
 const common='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
 const paths={
  search:`<circle cx="11" cy="11" r="7" ${common}/><path d="m16.5 16.5 4 4" ${common}/>`,
  grid:`<rect x="3" y="3" width="7" height="7" rx="1.5" ${common}/><rect x="14" y="3" width="7" height="7" rx="1.5" ${common}/><rect x="3" y="14" width="7" height="7" rx="1.5" ${common}/><rect x="14" y="14" width="7" height="7" rx="1.5" ${common}/>`,
  heart:`<path d="M20.8 8.8c0 5.2-8.8 10.2-8.8 10.2S3.2 14 3.2 8.8A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6Z" ${common}/>`,
  sliders:`<path d="M4 7h9M19 7h1M4 17h1M11 17h9" ${common}/><circle cx="16" cy="7" r="2.4" ${common}/><circle cx="8" cy="17" r="2.4" ${common}/>`
 };
 return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.grid}</svg>`;
};
const art = s => `<div class="mini-art ${String(s).toLowerCase()}"></div>`;
const seriesTag = s => `<span class="tag">${s}</span>`;

function card(b) {
 const status = b.tried ? `<span class="tag tried ${b.rating != null ? ratingTone(b.rating) : ''}">${b.rating != null ? `Tried · ${b.rating}/10` : 'Tried'}</span>` : seriesTag(b.series);
 const stock = b.blinkit ? 'Blinkit + web' : 'Website only';
 const best20 = bestPrice20(b);
 const shownPrice = availabilityFilter==='Blinkit' ? {value:b.blinkit?b.bPrice:null,source:'Blinkit'} : availabilityFilter==='Website' ? {value:b.website?b.wPrice:null,source:'Website'} : (b.blinkit && b.bPrice!=null && (!b.website || b.wPrice==null || b.bPrice<=b.wPrice)) ? {value:b.bPrice,source:'Blinkit'} : {value:b.website?b.wPrice:null,source:'Website'};
 return `<button class="bar-card" data-open="${b.id}" aria-label="View ${b.flavor} ${b.series}">
   ${art(b.series)}
   <div class="bar-info"><div class="meta">${status}</div><h3>${b.flavor}</h3><p><b>${b.protein}g protein</b> <span>·</span> ${b.cal} kcal</p><div class="metric-line"><span>${proteinEfficiency(b).toFixed(2)}g / 100 kcal</span><span>${best20 ? `${money(best20.value)} / 20g · ${best20.source}` : '20g price unavailable'}</span></div></div>
   <div class="bar-right"><strong>${money(shownPrice.value)}</strong><small>per bar · ${shownPrice.source}</small><div class="price-foot"><i class="availability-dot ${b.blinkit?'':'off'}"></i>${stock}</div></div>
 </button>`;
}

function filteredBars() {
 let list=allBars();
 if(tab==='tasted') list=list.filter(b=>b.tried);
 if(seriesFilter!=='All') list=list.filter(b=>b.series===seriesFilter);
 if(availabilityFilter==='Blinkit') list=list.filter(b=>b.blinkit);
 if(availabilityFilter==='Website') list=list.filter(b=>b.website);
 if(searchText.trim()) { const q=searchText.trim().toLowerCase(); list=list.filter(b=>(b.flavor+' '+b.series).toLowerCase().includes(q)); }
 // The Unique flavours switch only exists on All bars, so it must not silently shrink the Tried list.
 if(uniqueFlavoursOnly && tab!=='tasted') {
  const groups=new Map();
  list.forEach(b=>{
   const key=b.flavor.trim().toLowerCase();
   const group=groups.get(key) || {representative:null, tasting:null};
   const old=group.representative;
   if(!old || proteinEfficiency(b)>proteinEfficiency(old) || (proteinEfficiency(b)===proteinEfficiency(old) && b.protein>old.protein)) group.representative=b;
   if(b.tried && b.rating!=null && (!group.tasting || Number(b.rating)>Number(group.tasting.rating))) group.tasting=b;
   else if(b.tried && !group.tasting) group.tasting=b;
   groups.set(key,group);
  });
  list=[...groups.values()].map(group=>group.tasting
   ? {...group.representative,tried:true,rating:group.tasting.rating}
   : group.representative);
 }
 list.sort((a,b)=>{
  if(sortMode==='price20') return (bestPrice20(a)?.value ?? Infinity)-(bestPrice20(b)?.value ?? Infinity) || proteinEfficiency(b)-proteinEfficiency(a);
  return proteinEfficiency(b)-proteinEfficiency(a) || b.protein-a.protein;
 });
 return list;
}

const emptyHtml = () => `<div class="empty"><b>No bars found just yet.</b>Try another flavour or loosen the filters.</div>`;
const listHtml = items => items.length ? items.map(card).join('') : emptyHtml();
const summaryText = count => tab==='tasted' ? `${plural(count,'bar')} marked as tried.` : `${plural(count, uniqueFlavoursOnly ? 'unique flavour' : 'bar variant')}.`;
const resultLabel = count => tab==='tasted' ? `${plural(count,'tried bar')}` : plural(count, uniqueFlavoursOnly ? 'unique flavour' : 'bar');

function browsePage() {
 const isTasted = tab==='tasted';
 const items = filteredBars();
 const header = isTasted
  ? `<div class="taste-hero"><div><div class="eyebrow">YOUR AVERAGE RATING</div><h2>${avgRating()} <span style="font-size:13px;color:#8b819c">/ 10</span></h2><p>${ratedBars().length} rated · ${triedBars().length} tried</p></div><div class="taste-score"><b>${triedBars().length}</b><span>TRIED</span></div></div><div class="taste-tip"><div class="tip-dot">✳</div><div>Tap a bar to change its tried status or rating. Saved on this phone.</div></div>`
  : `<div class="search-wrap">${svg('search')}<input id="searchInput" type="search" placeholder="Search a flavour or series…" value="${escapeHtml(searchText)}" autocomplete="off"></div>
   <div class="filter-row">${['All','PRO','Core','Millet','Mini'].map(s=>`<button class="filter-chip ${seriesFilter===s?'active':''}" data-series="${s}">${s}${s==='All'?'<span class="count">23</span>':''}</button>`).join('')}</div><div class="unique-row"><label class="unique-toggle"><input type="checkbox" id="uniqueFlavours" ${uniqueFlavoursOnly?'checked':''}><span class="switch"></span><span>Unique flavours</span></label></div>
   <div class="filter-toolbar"><div class="availability-tabs">${['Any','Blinkit','Website'].map(s=>`<button class="${availabilityFilter===s?'active':''}" data-availability="${s}">${s}</button>`).join('')}</div><select class="sort-select" id="sortSelect" aria-label="Sort bars"><option value="efficiency" ${sortMode==='efficiency'?'selected':''}>Protein / 100 kcal · high to low</option><option value="price20" ${sortMode==='price20'?'selected':''}>₹ / 20g protein · low to high</option></select></div>`;
 return `<div class="page-title"><div class="eyebrow">${isTasted?'YOUR TRIED BARS':'THE FULL COLLECTION'}</div><h1>${isTasted?'Your tried bars.':'Protein bars, compared.'}</h1><p id="pageSummary">${summaryText(items.length)}</p></div>
  ${header}
  <div class="results-label"><span id="resultCount">${resultLabel(items.length)}</span><span>Tap a card for details ↗</span></div>
  <div class="bar-list" id="barsGrid">${listHtml(items)}</div>`;
}

/* Rendering: the page shell is built once. After that only the parts that changed are touched,
   so nothing replays an entrance animation and the screen never flashes. */
function renderShell() {
 $('#app').innerHTML = `<header class="topbar"><div class="brand"><div class="brand-mark"></div><div><div class="brand-name">BARBOOK</div><div class="brand-sub">THE WHOLE TRUTH TRACKER</div></div></div><div class="top-actions"><button class="icon-button" data-action="settings" aria-label="Settings" title="Settings">${svg('sliders')}</button></div></header><main id="mainView"></main>`;
}
function renderMain() { const main=$('#mainView'); if(main) main.innerHTML=browsePage(); }
function renderNav() {
 $('#bottomNav').innerHTML=[['browse','All bars'],['tasted','Tried']].map(([id,label])=>`<button class="nav-item ${tab===id?'active':''}" data-tab="${id}">${svg(id==='browse'?'grid':'heart')}<span>${label}</span></button>`).join('');
}
function updateNav() { document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab)); }
function render() { renderShell(); renderMain(); renderNav(); applyTheme(); }

function syncListMeta(count) {
 const label=$('#resultCount'); if(label) label.textContent=resultLabel(count);
 const summary=$('#pageSummary'); if(summary) summary.textContent=summaryText(count);
}
function updateListOnly() {
 const grid=$('#barsGrid'); if(!grid) return;
 const items=filteredBars();
 grid.innerHTML=listHtml(items);
 syncListMeta(items.length);
}
function refreshFilterStates() {
 document.querySelectorAll('[data-series]').forEach(el=>el.classList.toggle('active',el.dataset.series===seriesFilter));
 document.querySelectorAll('[data-availability]').forEach(el=>el.classList.toggle('active',el.dataset.availability===availabilityFilter));
 const unique=$('#uniqueFlavours'); if(unique) unique.checked=uniqueFlavoursOnly;
}
function switchTab(next) {
 if(next===tab) { window.scrollTo(0,0); return; }
 tab=next;
 if(tab!=='browse'){seriesFilter='All';availabilityFilter='Any';searchText='';sortMode='efficiency';}
 renderMain(); updateNav(); window.scrollTo(0,0);
}

/* Theme */
function applyTheme() {
 currentTheme = effectiveTheme();
 document.documentElement.dataset.theme = currentTheme;
 try { if (window.BarbookNative && window.BarbookNative.setThemeMode) window.BarbookNative.setThemeMode(themePref, currentTheme === 'dark'); } catch(e) {}
 const meta = $('meta[name="theme-color"]');
 if (meta) meta.content = currentTheme === 'dark' ? '#15141b' : '#f7f6f2';
 document.querySelectorAll('[data-theme-set]').forEach(el=>el.classList.toggle('active',el.dataset.themeSet===themePref));
}
function setTheme(mode) {
 themePref = normalizeThemePref(mode);
 storage.set(THEME_KEY, themePref);
 applyTheme();
}
if (systemDarkQuery) {
 const onSystemThemeChange = () => { if (themePref === 'system') applyTheme(); };
 if (systemDarkQuery.addEventListener) systemDarkQuery.addEventListener('change', onSystemThemeChange);
 else if (systemDarkQuery.addListener) systemDarkQuery.addListener(onSystemThemeChange);
}

/* Bottom sheets (bar details and settings) share one shell. The entrance animation is only
   applied when a sheet first opens; later updates patch the content inside the open sheet. */
function sheetShell(label, inner) {
 return `<div class="modal-backdrop enter" data-close="backdrop"><section class="sheet enter" role="dialog" aria-modal="true" aria-label="${escapeHtml(label)}">${inner}</section></div>`;
}
function metaHtml(b) {
 return seriesTag(b.series) + (b.tried ? `<span class="tag tried ${b.rating != null ? ratingTone(b.rating) : ''}">${b.rating != null ? 'Tried' : 'Tried · unrated'}</span>` : '');
}
function tastingHtml(b) {
 const tried=b.tried;
 const logStatus = !tried ? 'Not tried yet' : (b.rating != null ? `Rated ${b.rating}/10` : 'Tried · not rated yet');
 const controls = isEditing ? `
   <p class="edit-note">Changes stay in draft until you tap Save.</p>
   <div class="edit-state"><button class="edit-option ${editDraft.tried?'':'active'}" data-draft-tried="no">Not tried</button><button class="edit-option ${editDraft.tried?'active':''}" data-draft-tried="yes">Tried it</button></div>
   ${editDraft.tried ? `<div class="edit-rating-title">RATING · OUT OF 10</div><div class="rating-buttons">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button class="${editDraft.rating===n ? `active ${ratingTone(n)}` : ''}" data-draft-rate="${n}">${n}</button>`).join('')}</div>` : `<p class="edit-note">A rating is available when you mark this bar as tried.</p>`}
   <div class="edit-actions"><button class="discard-button" data-discard>Discard</button><button class="save-button" data-save ${hasDraftChanges()?'':'disabled'}>Save changes</button></div>` : `
   <div class="read-only-log"><span class="${tried && b.rating != null ? ratingTone(b.rating) : ''}">${tried ? (b.rating != null ? `Tried · ${b.rating}/10 rating.` : 'Tried · not rated yet.') : 'Not tried yet.'}</span><button class="edit-log-button" data-edit> Edit status & rating </button></div>`;
 return `<div class="tasting-head"><b>Your status & rating</b><span>${logStatus}</span></div>${controls}`;
}
function detailInnerHtml(b) {
 const best20=bestPrice20(b);
 return `<div class="sheet-handle"></div>
  <div class="sheet-top"><div class="sheet-title">${art(b.series)}<div><div class="meta" id="sheetMeta">${metaHtml(b)}</div><h2>${escapeHtml(b.flavor)}</h2><p>${b.series} series · ${b.protein}g protein per bar</p></div></div><button class="close-button" data-close="button" aria-label="Close">×</button></div>
  <div class="sheet-stats"><div class="sheet-stat"><b>${b.protein}g</b><span>PROTEIN</span></div><div class="sheet-stat"><b>${b.cal}</b><span>CALORIES</span></div><div class="sheet-stat"><b>${proteinEfficiency(b).toFixed(2)}</b><span>PROTEIN / 100 KCAL</span></div></div>
  <div class="detail-section"><h3>Price comparison</h3><div class="price-row"><span>Website · per bar</span><b>${money(b.website?b.wPrice:null)}</b></div><div class="price-row"><span>Blinkit · per bar</span><b>${money(b.blinkit?b.bPrice:null)}</b></div><div class="price-row"><span>Website · per 20g protein</span><b>${money(b.website?b.w20:null)}</b></div><div class="price-row"><span>Blinkit · per 20g protein</span><b>${money(b.blinkit?b.b20:null)}</b></div>${best20?`<div class="price-row"><span>Best available · per 20g</span><b>${money(best20.value)} · ${best20.source}</b></div>`:''}</div>
  <div class="detail-section"><h3>Availability</h3><div class="availability-pills"><span class="${b.blinkit?'':'off'}">${b.blinkit?'✓':'—'} Blinkit</span><span class="${b.website?'':'off'}">${b.website?'✓':'—'} Website</span></div></div>
  <div class="tasting-box" id="tastingBox">${tastingHtml(b)}</div>`;
}
function renderDetails() {
 const b=getBar(activeBarId); if(!b) return;
 const box=$('#tastingBox'); if(box) box.innerHTML=tastingHtml(b);
 const meta=$('#sheetMeta'); if(meta) meta.innerHTML=metaHtml(b);
}
function revealTastingBox() { const box=$('#tastingBox'); if(box && box.scrollIntoView) box.scrollIntoView({block:'nearest'}); }
function openDetails(id) {
 activeBarId=Number(id); const b=getBar(activeBarId); if(!b) return;
 settingsOpen=false; isEditing=false; editDraft=null;
 $('#modalRoot').innerHTML=sheetShell(`${b.flavor} details`, detailInnerHtml(b));
 document.body.style.overflow='hidden';
}
function closeSheet() {
 $('#modalRoot').innerHTML=''; document.body.style.overflow='';
 activeBarId=null; settingsOpen=false; isEditing=false; editDraft=null; confirmAction=null; pendingImport=null;
}
function hasDraftChanges() {
 if (!isEditing || !editDraft || activeBarId==null) return false;
 const current=getBar(activeBarId);
 return !!current && (Boolean(current.tried)!==Boolean(editDraft.tried) || (current.rating??null)!==(editDraft.rating??null));
}
function startEditing() { const b=getBar(activeBarId); if(!b)return; editDraft={tried:Boolean(b.tried),rating:b.rating??null}; isEditing=true; renderDetails(); revealTastingBox(); }
function changeDraftTried(value) { if(!editDraft)return; editDraft.tried=value; renderDetails(); revealTastingBox(); }
function changeDraftRating(score) { if(!editDraft)return; editDraft.tried=true; editDraft.rating=score; renderDetails(); }
function saveDraft() {
 if(!isEditing || !editDraft || activeBarId==null || !hasDraftChanges())return;
 edits[activeBarId]={...(edits[activeBarId]||{}),tried:Boolean(editDraft.tried),rating:editDraft.tried ? (editDraft.rating??null) : null};
 persist(); isEditing=false; editDraft=null; renderDetails(); renderMain(); toast('Changes saved');
}
function discardDraft() { isEditing=false; editDraft=null; renderDetails(); }
function persist() { storage.set(STORE_KEY, JSON.stringify(edits)); }
function toast(message) { const el=$('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),2200); }

/* Confirmation dialog */
function showConfirm(title, body, okLabel, cancelLabel, action) {
 if($('.confirm-backdrop')) return;
 confirmAction=action;
 $('#modalRoot').insertAdjacentHTML('beforeend', `<div class="confirm-backdrop"><div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle"><h3 id="confirmTitle">${escapeHtml(title)}</h3><p>${escapeHtml(body)}</p><div class="confirm-actions"><button class="confirm-button" data-confirm="cancel">${escapeHtml(cancelLabel)}</button><button class="confirm-button danger" data-confirm="ok">${escapeHtml(okLabel)}</button></div></div></div>`);
}
function dismissConfirm(run) {
 const action=confirmAction; confirmAction=null;
 const dialog=$('.confirm-backdrop'); if(dialog) dialog.remove();
 if(run && action) action();
}
function requestCloseSheet() {
 if(isEditing && hasDraftChanges()){ showConfirm('Discard your changes?','Your changes haven’t been saved. You can keep editing or discard the draft.','Discard changes','Keep editing',closeSheet); return; }
 closeSheet();
}
function handleBackPressed() {
 if($('.confirm-backdrop')) { dismissConfirm(false); return true; }
 if(activeBarId!=null || settingsOpen) { requestCloseSheet(); return true; }
 return false;
}

/* Settings and backup */
function cleanEdits(source) {
 const out={};
 if(!source || typeof source!=='object' || Array.isArray(source)) return out;
 Object.keys(source).forEach(key=>{
  const id=Number(key);
  if(!BARS.some(b=>b.id===id)) return;
  const entry=source[key];
  if(!entry || typeof entry!=='object') return;
  const tried=entry.tried===true;
  let rating=null;
  if(tried && entry.rating!=null){ const n=Number(entry.rating); if(Number.isInteger(n) && n>=1 && n<=10) rating=n; }
  out[id]={tried,rating};
 });
 return out;
}
function backupCounts(map) {
 const list=Object.keys(map).map(k=>map[k]);
 return {total:list.length, tried:list.filter(e=>e.tried).length, rated:list.filter(e=>e.rating!=null).length};
}
function buildBackup() {
 return {app:'barbook', format:BACKUP_FORMAT, appVersion:APP_VERSION, exportedAt:new Date().toISOString(), edits:cleanEdits(edits), settings:{theme:themePref, uniqueFlavours:uniqueFlavoursOnly}};
}
function backupFileName() {
 const d=new Date(); const p=n=>String(n).padStart(2,'0');
 return `barbook-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
}
function settingsInnerHtml() {
 const tried=triedBars().length, rated=ratedBars().length;
 return `<div class="sheet-handle"></div>
  <div class="sheet-top"><div class="sheet-title"><div><h2>Settings</h2><p>Barbook v${APP_VERSION} · everything stays on this phone</p></div></div><button class="close-button" data-close="button" aria-label="Close">×</button></div>
  <div class="detail-section"><h3>Appearance</h3><div class="edit-state three">${[['light','Light'],['dark','Dark'],['system','System']].map(([id,label])=>`<button class="edit-option ${themePref===id?'active':''}" data-theme-set="${id}">${label}</button>`).join('')}</div><p class="edit-note">System follows your phone's light or dark setting.</p></div>
  <div class="detail-section"><h3>Backup</h3>
   <div class="setting-row"><div><b>Export ratings</b><small>${plural(tried,'tried bar')} · ${rated} rated. Saves a file you can keep.</small></div><button class="edit-log-button" data-export>Export</button></div>
   <div class="setting-row"><div><b>Import ratings</b><small>Replace current ratings with a Barbook backup file.</small></div><button class="edit-log-button" data-import>Import</button></div>
   <p class="edit-note" id="backupNote">Uninstalling the app or clearing its data erases your ratings, so export a backup first.</p>
  </div>`;
}
function openSettings() {
 activeBarId=null; isEditing=false; editDraft=null; settingsOpen=true;
 $('#modalRoot').innerHTML=sheetShell('Settings', settingsInnerHtml());
 document.body.style.overflow='hidden';
}
function refreshSettings() { const sheet=$('.sheet'); if(settingsOpen && sheet) sheet.innerHTML=settingsInnerHtml(); }
function setBackupNote(text) { const note=$('#backupNote'); if(note) note.textContent=text; }

function exportBackup() {
 const name=backupFileName();
 const json=JSON.stringify(buildBackup(),null,2);
 if(window.BarbookNative && window.BarbookNative.saveBackup) { window.BarbookNative.saveBackup(name,json); return; }
 const link=document.createElement('a');
 link.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
 link.download=name; document.body.appendChild(link); link.click(); link.remove();
 setTimeout(()=>URL.revokeObjectURL(link.href),1000);
 toast('Backup downloaded');
}
function importBackup() {
 if(window.BarbookNative && window.BarbookNative.pickBackup) { window.BarbookNative.pickBackup(); return; }
 const input=$('#importFile'); if(input) input.click();
}
function parseBackup(text) {
 if(typeof text!=='string' || text.length>MAX_BACKUP_CHARS) return {error:'That file is too large to be a Barbook backup.'};
 let data;
 try { data=JSON.parse(text); } catch(e) { return {error:'That file is not a valid Barbook backup.'}; }
 if(!data || typeof data!=='object' || data.app!=='barbook' || !data.edits || typeof data.edits!=='object' || Array.isArray(data.edits)) return {error:'That file is not a valid Barbook backup.'};
 const map=cleanEdits(data.edits);
 const settings=data.settings && typeof data.settings==='object' ? data.settings : {};
 return {edits:map, settings, counts:backupCounts(map)};
}
function applyImport(result) {
 edits=result.edits; persist();
 if(['light','dark','system'].includes(result.settings.theme)) setTheme(result.settings.theme);
 if(typeof result.settings.uniqueFlavours==='boolean'){ uniqueFlavoursOnly=result.settings.uniqueFlavours; storage.set(UNIQUE_KEY,String(uniqueFlavoursOnly)); }
 renderMain(); refreshSettings(); applyTheme();
 toast('Backup restored');
}
/* Called by the Android wrapper (or the browser file input) once a backup file has been read. */
function onBackupPicked(text) {
 const result=parseBackup(text);
 if(result.error){ setBackupNote(result.error); toast('Import failed'); return; }
 pendingImport=result;
 const c=result.counts;
 showConfirm('Replace your ratings?', `This backup has ${plural(c.tried,'tried bar')} and ${c.rated} rated. Your current ratings on this phone will be replaced.`, 'Replace ratings', 'Cancel', ()=>{ const r=pendingImport; pendingImport=null; if(r) applyImport(r); });
}
function onBackupSaved(ok) { toast(ok ? 'Backup saved' : 'Backup cancelled'); }
function onBackupError(message) { setBackupNote(message || 'Something went wrong with the backup file.'); toast('Backup failed'); }

/* Events */
document.addEventListener('click',e=>{
 const t=e.target;
 const action=t.closest('[data-action]'); if(action){ if(action.dataset.action==='settings') openSettings(); return; }
 const confirmBtn=t.closest('[data-confirm]'); if(confirmBtn){ dismissConfirm(confirmBtn.dataset.confirm==='ok'); return; }
 const nav=t.closest('[data-tab]'); if(nav){ switchTab(nav.dataset.tab); return; }
 const series=t.closest('[data-series]'); if(series){seriesFilter=series.dataset.series;refreshFilterStates();updateListOnly();return;}
 const availability=t.closest('[data-availability]'); if(availability){availabilityFilter=availability.dataset.availability;refreshFilterStates();updateListOnly();return;}
 const uniqueToggle=t.closest('#uniqueFlavours'); if(uniqueToggle){uniqueFlavoursOnly=uniqueToggle.checked;storage.set(UNIQUE_KEY,String(uniqueFlavoursOnly));updateListOnly();return;}
 const open=t.closest('[data-open]'); if(open){openDetails(open.dataset.open);return;}
 const close=t.closest('[data-close]'); if(close && (close.dataset.close==='button'||t===close)){requestCloseSheet();return;}
 const themeSet=t.closest('[data-theme-set]'); if(themeSet){setTheme(themeSet.dataset.themeSet);return;}
 if(t.closest('[data-export]')){exportBackup();return;}
 if(t.closest('[data-import]')){importBackup();return;}
 if(t.closest('[data-edit]')){startEditing();return;}
 const draftTried=t.closest('[data-draft-tried]'); if(draftTried){changeDraftTried(draftTried.dataset.draftTried==='yes');return;}
 const draftRate=t.closest('[data-draft-rate]'); if(draftRate){changeDraftRating(Number(draftRate.dataset.draftRate));return;}
 if(t.closest('[data-save]')){saveDraft();return;}
 if(t.closest('[data-discard]')){discardDraft();return;}
});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){searchText=e.target.value;updateListOnly();}});
document.addEventListener('change',e=>{
 if(e.target.id==='sortSelect'){sortMode=e.target.value;updateListOnly();return;}
 if(e.target.id==='importFile'){
  const file=e.target.files && e.target.files[0]; e.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>onBackupPicked(String(reader.result||''));
  reader.onerror=()=>onBackupError('Could not read that file.');
  reader.readAsText(file);
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){ if($('.confirm-backdrop')){dismissConfirm(false);return;} if(activeBarId!=null||settingsOpen) requestCloseSheet(); }});
render();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('preload')));
</script>
</body>
</html>
